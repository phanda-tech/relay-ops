name: Stored permission checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: relay_permissions
          POSTGRES_USER: relay_test
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: relay_test
      PGPASSWORD: ephemeral-ci-only
      PGDATABASE: relay_permissions
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f db/migrations/001_persistence.sql
      - run: psql -v ON_ERROR_STOP=1 -f db/migrations/002_memberships.sql
      - run: psql -v ON_ERROR_STOP=1 -f db/tests/permissions.sql
