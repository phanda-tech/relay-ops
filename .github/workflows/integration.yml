name: PostgreSQL adapter integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: relay_integration
          POSTGRES_USER: relay_test
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RELAY_TEST_DATABASE_URL: postgresql://relay_test:ephemeral-ci-only@localhost:5432/relay_integration
      REQUIRE_DATABASE_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npm run test:integration
